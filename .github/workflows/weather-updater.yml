name: Update Weather Data

on:
  schedule:
    - cron: '0 * * * *' # Körs automatiskt varje heltimme
  workflow_dispatch: # Gör att du kan starta den manuellt med en knapp!

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Klonar arkiv
        uses: actions/checkout@v4

      - name: Installerar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 1. Hämtar väderdata (SMHI & YR)
        run: node fetch-weather.js

      - name: 2. Låter GitHubs AI göra en väderbedömning
        run: |
          # Läser in väderdatan vi precis skapade
          DATA=$(cat weather.json | tr -d '\n' | tr -d '"')
          
          # Gör ett direkt anrop till GitHubs kostnadsfria AI-ändpunkt med din GITHUB_TOKEN
          curl -X POST "https://azure.com" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"Du är en meteorolog som sammanfattar väderdata kort på svenska.\"},
                {\"role\": \"user\", \"content\": \"Gör en kort bedömning på 2-3 meningar av följande väder samt sätt en risknivå (Låg, Medel eller Hög): $DATA\"}
              ],
              \"temperature\": 0.3
            }" > ai-response.json
            
          # Extraherar ut textsvaret till vår textfil
          cat ai-response.json | grep -o '"content":"[^"]*' | head -n 1 | sed 's/"content":"//' > copilot-assessment.txt
        continue-on-error: true # Om AI-tjänsten är överbelastad sparar vi ändå väderdatan

      - name: 3. Sparar alla filer till GitHub
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add weather.json copilot-assessment.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Uppdaterade väder och Copilot-analys" && git push)
