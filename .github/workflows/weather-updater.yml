name: Update Weather Data

on:
  schedule:
    - cron: '0 * * * *' # Körs automatiskt varje heltimme
  workflow_dispatch: # Gör att du kan starta den manuellt med en knapp!

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # Ger GitHub Actions tillåtelse att skriva och spara filer i ditt arkiv
    permissions:
      contents: write
      
    steps:
      - name: Klonar arkiv
        uses: actions/checkout@v4

      - name: Installerar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hämtar väderdata
        run: node fetch-weather.js

      - name: Sparar data till GitHub
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add weather.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Uppdaterade väderdata" && git push)

